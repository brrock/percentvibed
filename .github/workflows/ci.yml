name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun run --cwd packages/cli typecheck

      - name: Build Linux x64 scanner for tests
        run: |
          set -euo pipefail
          rm -rf packages/scanner-zig/zig-out packages/scanner-zig/.zig-cache
          (cd packages/scanner-zig && zig build -Dtarget=x86_64-linux -Doptimize=ReleaseSafe)
          mkdir -p packages/scanner-linux-x64
          cp packages/scanner-zig/zig-out/percentvibed_scanner.node packages/scanner-linux-x64/percentvibed_scanner.node

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Large PR smoke test
        env:
          PERCENTVIBED_SCANNER_NATIVE: ${{ github.workspace }}/packages/scanner-linux-x64/percentvibed_scanner.node
        run: bun run test
