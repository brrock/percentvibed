name: Release npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun run --cwd packages/cli typecheck

      - name: Build native scanner packages
        shell: bash
        run: |
          set -euo pipefail

          build_scanner() {
            local target="$1"
            local package_dir="$2"
            local exe_name="$3"

            echo "Building scanner for ${target} -> ${package_dir}/bin/${exe_name}"
            rm -rf packages/scanner-zig/zig-out packages/scanner-zig/.zig-cache
            (cd packages/scanner-zig && zig build -Dtarget="${target}" -Doptimize=ReleaseSafe)
            mkdir -p "${package_dir}/bin"
            cp "packages/scanner-zig/zig-out/bin/${exe_name}" "${package_dir}/bin/${exe_name}"
            chmod +x "${package_dir}/bin/${exe_name}"
          }

          # Publish only the packages that have npm trusted publishing configured today.
          build_scanner "aarch64-macos" "packages/scanner-darwin-arm64" "percentvibed-scan"
          build_scanner "x86_64-linux"  "packages/scanner-linux-x64"    "percentvibed-scan"

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Smoke test with built linux scanner
        env:
          PERCENTVIBED_SCANNER: ${{ github.workspace }}/packages/scanner-linux-x64/bin/percentvibed-scan
        run: bun run test

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-packages
          for package in \
            packages/scanner-darwin-arm64 \
            packages/scanner-linux-x64 \
            packages/scanner \
            packages/cli
          do
            (cd "$package" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-packages")
          done

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarballs
          path: npm-packages/*.tgz

      - name: Publish packages to npm with trusted publishing
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package_dir="$1"
            echo "Publishing ${package_dir}"
            (cd "$package_dir" && npm publish --provenance --access public)
          }

          publish_package packages/scanner-darwin-arm64
          publish_package packages/scanner-linux-x64
          publish_package packages/scanner
          publish_package packages/cli
