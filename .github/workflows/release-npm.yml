name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm package version to publish (for example, 0.2.0 or v0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Determine npm package version
        id: release_version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME}"
          else
            raw_version="${INPUT_VERSION}"
          fi

          version="${raw_version#v}"
          if [[ -z "${version}" ]]; then
            echo "Release version is required for manual dispatch." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid npm package version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Update package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          const publishedPackageFiles = [
            "packages/scanner-darwin-arm64/package.json",
            "packages/scanner-linux-x64/package.json",
            "packages/scanner/package.json",
            "packages/cli/package.json",
          ];
          const scannerNativePackageNames = [
            "@percentvibed/scanner-darwin-arm64",
            "@percentvibed/scanner-linux-x64",
          ];

          function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          function setStringProperty(text, propertyName, value) {
            const pattern = new RegExp(`("${escapeRegExp(propertyName)}"\\s*:\\s*)"[^"]*"`);
            if (!pattern.test(text)) {
              throw new Error(`Could not find ${propertyName}`);
            }
            return text.replace(pattern, (_match, prefix) => `${prefix}"${value}"`);
          }

          for (const file of publishedPackageFiles) {
            let text = readFileSync(file, "utf8");
            text = setStringProperty(text, "version", version);

            if (file === "packages/cli/package.json") {
              text = setStringProperty(text, "@percentvibed/scanner", version);
            }

            if (file === "packages/scanner/package.json") {
              for (const packageName of scannerNativePackageNames) {
                text = setStringProperty(text, packageName, version);
              }
            }

            JSON.parse(text);
            writeFileSync(file, text);
          }
          NODE

          bun install --lockfile-only

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun run --cwd packages/cli typecheck

      - name: Build native scanner packages
        shell: bash
        run: |
          set -euo pipefail

          build_scanner() {
            local target="$1"
            local package_dir="$2"

            echo "Building scanner for ${target} -> ${package_dir}/percentvibed_scanner.node"
            rm -rf packages/scanner-zig/zig-out packages/scanner-zig/.zig-cache
            (cd packages/scanner-zig && zig build -Dtarget="${target}" -Doptimize=ReleaseSafe)
            mkdir -p "${package_dir}"
            cp "packages/scanner-zig/zig-out/percentvibed_scanner.node" "${package_dir}/percentvibed_scanner.node"
          }

          # Publish only the packages that have npm trusted publishing configured today.
          build_scanner "aarch64-macos" "packages/scanner-darwin-arm64"
          build_scanner "x86_64-linux"  "packages/scanner-linux-x64"

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Smoke test with built linux scanner
        env:
          PERCENTVIBED_SCANNER_NATIVE: ${{ github.workspace }}/packages/scanner-linux-x64/percentvibed_scanner.node
        run: bun run test

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-packages
          for package in \
            packages/scanner-darwin-arm64 \
            packages/scanner-linux-x64 \
            packages/scanner \
            packages/cli
          do
            (cd "$package" && npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-packages")
          done

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarballs
          path: npm-packages/*.tgz

      - name: Publish packages to npm with trusted publishing
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package_dir="$1"
            echo "Publishing ${package_dir}"
            (cd "$package_dir" && npm publish --provenance --access public)
          }

          publish_package packages/scanner-darwin-arm64
          publish_package packages/scanner-linux-x64
          publish_package packages/scanner
          publish_package packages/cli
